name: probe-detail
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for s in 5185 5183 5150; do
            echo "=== $s"
            curl -s -m 20 "https://www.ksponco.or.kr/olympicpark/eventInfo/eventInfoView.es?mid=a20301010100&evtSeq=$s" -o d.html
            wc -c d.html
            python3 - <<'PY'
          import re,html
          t=open('d.html',encoding='utf-8',errors='replace').read()
          t=re.sub(r'(?s)<(script|style).*?</\1>','',t)
          t=re.sub(r'<br\s*/?>|</(p|li|tr|div|dt|dd|th|td|h\d)>','\n',t)
          t=html.unescape(re.sub(r'<[^>]+>','',t))
          lines=[re.sub(r'\s+',' ',l).strip() for l in t.split('\n')]
          lines=[l for l in lines if l]
          for i,l in enumerate(lines):
              if re.search(r'공연\s*(일시|시간)|관람\s*시간|러닝|소요|평일|주말|요일|[0-9]\s*시',l) and len(l)<300:
                  print(i,l)
          PY
          done
