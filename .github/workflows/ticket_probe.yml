name: probe-ticket-runtime
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: robots and product pages
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36"
          set +e
          for id in 26013810 26014222 26016335 26007874 26015207 26014056; do
            u="https://nol.yanolja.com/ticket/products/$id"
            code=$(curl -s -m 30 -A "$UA" -o p.html -w '%{http_code}' "$u"); echo "===== $id $code"
            grep -oE 'goodsName[^,]{0,60}' p.html | head -1
            grep -oE 'runningTime[^,]{0,30}' p.html | head -2
            grep -oE 'interMissionTime[^,]{0,12}' p.html | head -1
            grep -oE '(관람시간|공연시간|러닝타임)[^<]{0,60}' p.html | head -3
          done
