name: probe-src
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA='Mozilla/5.0'
          show() { python3 - "$1" <<'PY'
          import re,html,sys
          t=open('p.html',encoding='utf-8',errors='replace').read()
          s=re.sub(r'\s+',' ',html.unescape(re.sub(r'<[^>]+>',' ',re.sub(r'(?s)<(script|style).*?</\1>','',t))))
          for k in sys.argv[1].split('|'):
              for m in list(re.finditer(k,s))[:2]: print(' ',k,'|',s[max(0,m.start()-80):m.start()+160])
          for m in sorted(set(re.findall(r'href="([^"]*(?:download|fileDown|csv|xlsx|dataset)[^"]*)"',t,re.I)))[:10]: print('  link',m)
          PY
          }
          echo "=== culture API_CPM_008 search"; curl -s -m 30 -A "$UA" "https://www.culture.go.kr/data/openapi/openapiList.do?keyword=%EC%9E%85%EC%B6%9C%EC%B0%A8" -o p.html; wc -c p.html; grep -o 'openapiView.do?id=[0-9]*[^<]\{0,120\}' p.html | head
          for id in $(grep -o 'openapiView.do?id=[0-9]*' p.html | sort -u | cut -d= -f2 | head -3) 675; do echo "=== culture id $id"; curl -s -m 30 -A "$UA" "https://www.culture.go.kr/data/openapi/openapiView.do?id=$id" -o p.html; wc -c p.html; show "입출차|파일|다운로드|샘플|CSV|제공 ?건수|데이터 건수"; done
          echo "=== bigdata-culture search"; curl -s -m 30 -A "$UA" "https://www.bigdata-culture.kr/bigdata/user/data_market/list.do?searchKeyword=%EC%98%AC%EB%A6%BC%ED%94%BD%EA%B3%B5%EC%9B%90" -o p.html; wc -c p.html; show "입출차|올림픽공원"
