name: 공연 일정 받기
on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 출차·수집 경계 조건 검사
        run: |
          node tests/engine.cjs
          node tests/schedule-fetch.cjs
          python -m unittest discover -s tests
      - name: 지난달·이번 달·다음 달 공연 일정 받기
        run: node scripts/fetch_schedule.cjs
      - name: 문화공공데이터광장 공연정보 보강
        id: enrich
        env:
          KCISA_SERVICE_KEY: ${{ secrets.KCISA_SERVICE_KEY }}
        run: |
          if [ -n "$KCISA_SERVICE_KEY" ]; then python scripts/enrich_performances.py; fi
        continue-on-error: true
      - name: KOPIS 러닝타임 보강
        id: kopis
        env:
          KOPIS_SERVICE_KEY: ${{ secrets.KOPIS_SERVICE_KEY }}
        run: |
          if [ -n "$KOPIS_SERVICE_KEY" ]; then python scripts/kopis_enrich.py; else echo "KOPIS 키가 없어 건너뜀"; fi
        continue-on-error: true
      - name: 예매처(NOL 티켓) 러닝타임 보강
        id: ticket
        run: python scripts/ticket_runtime.py
        continue-on-error: true
      - name: 바뀌었으면 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add schedule.json $(ls kopis_report.md 2>/dev/null)
          git diff --cached --quiet || (git commit -m "공연 일정 갱신" && (git push || (git pull -q --rebase origin main && git push)))
      - name: 공연정보 보강 경고
        if: steps.enrich.outcome == 'failure' || steps.kopis.outcome == 'failure' || steps.ticket.outcome == 'failure'
        run: echo "::warning::공연정보 보강 단계 일부가 실패했어요. 기관 공연 일정은 저장됐어요." 
