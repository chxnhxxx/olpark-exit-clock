name: probe-event-detail
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Find detail URL pattern and look for running time
        run: |
          B=https://www.ksponco.or.kr/olympicpark/eventInfo
          curl -s -m 20 "$B/eventInfoList?mid=a20301010100" -o list.html; echo "list bytes $(wc -c < list.html)"
          grep -oE "(eventInfoView|evtSeq|fn_[A-Za-z]*View|location\.href)[^\"'<>]{0,120}" list.html | sort -u | head -20
          grep -oE "<script[^>]*src=\"[^\"]*eventInfo[^\"]*\"" list.html | head
          for s in 5168 5173 5178 5159; do
            for u in "$B/eventInfoView?mid=a20301010100&evtSeq=$s" "$B/eventInfoDetail?mid=a20301010100&evtSeq=$s" "$B/eventInfoView.es?mid=a20301010100&evtSeq=$s"; do
              code=$(curl -s -m 20 -o d.html -w '%{http_code}' "$u"); echo "== $s $code $(wc -c < d.html) ${u#$B/}"
              if [ "$code" = 200 ]; then sed 's/<[^>]*>/ /g' d.html | tr -s ' \t' ' ' | grep -E "관람시간|러닝|공연시간|소요|[0-9]+ ?분" | head -8; fi
            done
          done
