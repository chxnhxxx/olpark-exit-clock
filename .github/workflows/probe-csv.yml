name: probe-csv
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA='Mozilla/5.0'
          for u in "https://www.data.go.kr/data/15159093/openapi.do" "https://www.data.go.kr/data/15138735/fileData.do" "https://www.data.go.kr/data/15164822/fileData.do"; do
            echo "=== $u"; curl -s -m 30 -A "$UA" "$u" -o p.html; wc -c p.html
            python3 - <<'PY'
          import re,html
          t=open('p.html',encoding='utf-8',errors='replace').read()
          for m in sorted(set(re.findall(r'/data/(\d{8})/(fileData|openapi)\.do',t))): print('link',m)
          s=html.unescape(re.sub(r'<[^>]+>',' ',re.sub(r'(?s)<(script|style).*?</\1>','',t)))
          s=re.sub(r'\s+',' ',s)
          for k in ['수정일','갱신주기','확장자','파일데이터명','데이터명','다운로드','제공기간','데이터 한계','2025','등록일']:
              for m in re.finditer(k,s):
                  print(k,'|',s[max(0,m.start()-60):m.start()+140]); break
          PY
          done
          echo "=== search"
          for q in "올림픽공원 차량 입출차" "올림픽공원 주차 2025"; do
            curl -s -m 30 -A "$UA" -G "https://www.data.go.kr/tcs/dss/selectDataSetList.do" --data-urlencode "keyword=$q" -o s.html; wc -c s.html
            python3 - <<'PY'
          import re,html
          t=open('s.html',encoding='utf-8',errors='replace').read()
          for m in re.finditer(r'/data/(\d{8})/(fileData|openapi)\.do[^>]*>(.*?)</a>',t,re.S):
              print(m.group(1),m.group(2),re.sub(r'\s+',' ',html.unescape(re.sub(r'<[^>]+>','',m.group(3)))).strip()[:90])
          PY
          done
